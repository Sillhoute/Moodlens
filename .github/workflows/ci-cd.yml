name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fer:ci-only-password@localhost:5432/fer_db?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-32-chars
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build
      - run: bun run test -- src

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:9000/api
      NEXTAUTH_URL: http://localhost:4000
      AUTH_URL: http://localhost:4000/api/auth
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ci-only-secret-not-for-production-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run build

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/moodlens-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:9000/api
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DB_USER: fer
      DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DB_NAME: fer_db
      DB_PORT: "5432"
      POSTGRES_HOST: database
      PORT: "9000"
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRE_MINUTES: "480"
      NEXT_PUBLIC_API_URL: http://localhost:9000/api
      NEXTAUTH_URL: http://localhost:4000
      AUTH_URL: http://localhost:4000/api/auth
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.JWT_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.JWT_SECRET }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tarik image terbaru dan jalankan container
        run: |
          $ErrorActionPreference = 'Continue'
          $env:IMAGE_PREFIX = "docker.io/$($env:DOCKERHUB_USERNAME.ToLower())/moodlens"
          $pw = [uri]::EscapeDataString($env:DB_PASSWORD)
          $env:DATABASE_URL = "postgresql://$($env:DB_USER):$pw@$($env:POSTGRES_HOST):$($env:DB_PORT)/$($env:DB_NAME)?schema=public"

          docker compose pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 420
          if ($LASTEXITCODE -ne 0) { docker compose ps; docker compose logs --tail 50 backend; exit 1 }
      - name: Smoke test
        run: |
          $ErrorActionPreference = 'Continue'
          curl.exe --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 5 --retry-all-errors "http://127.0.0.1:9000/api/health"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl.exe --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 3 --retry-all-errors -o NUL "http://127.0.0.1:4000/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
