name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- Continuous Integration (Test & Lint) ----------
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fer
          POSTGRES_PASSWORD: rahasia_test
          POSTGRES_DB: fer_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fer:rahasia_test@localhost:5432/fer_db?schema=public
      JWT_SECRET: "test-secret-key-for-ci-pipeline-only"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------- Build & Push Docker Images ke GHCR ----------
  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend, database]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Perhatikan indentasi 'with:' di bawah ini agar tidak error 'Invalid action input'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------- Generate Env & Deploy ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Backend .env.deploy securely
        run: |
          mkdir -p backend
          echo "PORT=9000" >> backend/.env.deploy
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env.deploy
          echo "JWT_EXPIRE_MINUTES=480" >> backend/.env.deploy
          echo "POSTGRES_HOST=database" >> backend/.env.deploy
          echo "POSTGRES_PORT=5432" >> backend/.env.deploy
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> backend/.env.deploy
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> backend/.env.deploy
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> backend/.env.deploy
          echo 'DATABASE_URL="postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@database:5432/${{ secrets.POSTGRES_DB }}?schema=public"' >> backend/.env.deploy

      - name: Generate Frontend .env.deploy securely
        run: |
          mkdir -p frontend
          echo 'NEXT_PUBLIC_API_URL="http://localhost:9000/api"' >> frontend/.env.deploy
          echo 'NEXTAUTH_URL="http://localhost:4000"' >> frontend/.env.deploy
          echo 'AUTH_URL="http://localhost:4000/api/auth"' >> frontend/.env.deploy
          echo "AUTH_TRUST_HOST=true" >> frontend/.env.deploy
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> frontend/.env.deploy
          echo "NEXTAUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> frontend/.env.deploy

      - name: Info Deployment Berhasil
        run: |
          echo "Konfigurasi deploy berhasil di-generate dari GitHub Secrets!"
