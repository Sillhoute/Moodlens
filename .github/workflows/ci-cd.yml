name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- Continuous Integration ----------
  # Memuat model asli, lalu menguji login, prediksi, riwayat, dan statistik terhadap PostgreSQL.
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fer
          POSTGRES_PASSWORD: fer_test
          POSTGRES_DB: fer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fer:fer_test@localhost:5432/fer_test
      JWT_SECRET: rahasia-uji-otomatis-minimal-32-karakter
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Build di VM GitHub lalu push ke Docker Hub. Hanya untuk kode yang sudah masuk ke main.
  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, database]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Docker Hub hanya mengenal satu tingkat nama: <username>/<repository>.
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/fer-ensemble-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Hanya dipakai oleh frontend untuk menampilkan versi deploy.
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------- Continuous Deployment ----------
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_PORT: 8088
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Hentikan versi aplikasi sebelumnya
        run: |
          # Versi MoodLens memakai nama proyek lain dan port yang sama. Datanya tidak dihapus.
          $ErrorActionPreference = 'Continue'
          docker compose -p moodlens down --remove-orphans
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tarik image terbaru dan jalankan container
        run: |
          # Docker menulis progres ke stderr, jadi kegagalan dicek dari exit code.
          $ErrorActionPreference = 'Continue'
          # Nama image di registry wajib huruf kecil.
          $env:IMAGE_PREFIX = "docker.io/$($env:DOCKERHUB_USERNAME.ToLower())/fer-ensemble"
          $env:POSTGRES_PASSWORD_URL = [uri]::EscapeDataString($env:POSTGRES_PASSWORD)
          docker compose pull frontend backend database
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test
        run: |
          $ErrorActionPreference = 'Continue'
          curl.exe --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 3 --retry-all-errors "http://127.0.0.1:$($env:APP_PORT)/api/health"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl.exe --fail --silent --show-error --max-time 10 "http://127.0.0.1:$($env:APP_PORT)/api/model-info"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
