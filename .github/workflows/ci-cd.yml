name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- Continuous Integration (Test) ----------
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run test

  # Memuat model asli dan memastikan label ekspresi serta deteksi wajah benar.
  test-ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:9000/api

  # ---------- Build di VM GitHub lalu push ke Docker Hub ----------
  # Hanya untuk kode yang sudah masuk ke main, bukan pull request.
  build-and-push:
    needs: [test-backend, test-ml, test-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Database memakai image resmi postgres:15-alpine, jadi tidak perlu di-build.
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/moodlens-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Hanya dipakai frontend: alamat backend untuk browser.
          build-args: NEXT_PUBLIC_API_URL=http://localhost:9000/api
          cache-from: type=gha,scope=moodlens-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=moodlens-${{ matrix.service }}

  # ---------- Continuous Deployment ----------
  # Server (laptop dengan self-hosted runner) menarik image terbaru dari Docker Hub lalu menjalankannya.
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # Kalau secret AUTH_SECRET belum dibuat, JWT_SECRET dipakai sebagai gantinya.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.JWT_SECRET }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tarik image terbaru dan jalankan container
        run: |
          # Docker menulis progres ke stderr, jadi kegagalan dicek dari exit code.
          $ErrorActionPreference = 'Continue'
          # Nama image di registry wajib huruf kecil.
          $env:IMAGE_PREFIX = "docker.io/$($env:DOCKERHUB_USERNAME.ToLower())/moodlens"
          $env:POSTGRES_PASSWORD_URL = [uri]::EscapeDataString($env:POSTGRES_PASSWORD)
          docker compose pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test
        run: |
          $ErrorActionPreference = 'Continue'
          curl.exe --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 3 --retry-all-errors "http://127.0.0.1:9000/api/health"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl.exe --fail --silent --show-error --max-time 10 -o NUL "http://127.0.0.1:4000/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
