name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- Continuous Integration ----------
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moodlens
          POSTGRES_PASSWORD: moodlens
          POSTGRES_DB: moodlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moodlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: moodlens
      PGPASSWORD: moodlens
      PGDATABASE: moodlens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Memuat bobot asli dan memastikan model masih memprediksi foto uji dengan benar.
  test-ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Build dan push hanya berjalan untuk kode yang sudah masuk ke main, bukan pull request.
  build-and-push:
    needs: [test-backend, test-frontend, test-ml]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend, ml-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------- Continuous Deployment ----------
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      APP_PORT: 8088
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tarik image terbaru dan jalankan container
        run: |
          # Docker menulis progres ke stderr, jadi kegagalan dicek dari exit code.
          $ErrorActionPreference = 'Continue'
          # Nama image di registry wajib huruf kecil.
          $env:IMAGE_PREFIX = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLower())"
          docker compose pull frontend backend ml-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 240
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test
        run: |
          $ErrorActionPreference = 'Continue'
          curl.exe --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 3 --retry-all-errors "http://127.0.0.1:$($env:APP_PORT)/api/health"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Prediksi sungguhan melewati frontend, backend, dan ml-service tanpa menulis riwayat.
          curl.exe --fail --silent --show-error --max-time 60 -F "image=@ml-service/tests/fixtures/astronaut.jpg;type=image/jpeg" -F "save=false" "http://127.0.0.1:$($env:APP_PORT)/api/predictions"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
