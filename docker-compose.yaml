name: moodlens

services:
  # 1. Container PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: moodlens-db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fer_network

  # 2. Container Backend Express.js + Python ML
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodlens-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "9000:9000"
    depends_on:
      - database
    networks:
      - fer_network

  # 3. Container Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moodlens-frontend
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "4000:4000"
    depends_on:
      - backend
    networks:
      - fer_network

volumes:
  postgres_data:

networks:
  fer_network:
    driver: bridge
