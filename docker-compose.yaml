name: moodlens

services:
  # 1. Container PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: moodlens-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fer_network

  # 2. Container Backend Express.js + Python ML
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodlens-backend
    restart: always
    environment:
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${DB_PORT}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "9000:9000"
    depends_on:
      - database
    networks:
      - fer_network

  # 3. Container Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:9000/api
    container_name: moodlens-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      - backend
    networks:
      - fer_network

volumes:
  postgres_data:

networks:
  fer_network:
    driver: bridge
