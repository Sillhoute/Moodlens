name: fer-ensemble

services:
  frontend:
    image: ${IMAGE_PREFIX:-fer-ensemble}/frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        APP_VERSION: ${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - web

  backend:
    image: ${IMAGE_PREFIX:-fer-ensemble}/backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    environment:
      # POSTGRES_PASSWORD_URL diisi pipeline deploy dengan password yang sudah di-encode untuk URL,
      # agar password dengan karakter seperti @ atau : tetap bisa dipakai.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fer}:${POSTGRES_PASSWORD_URL:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}}@database:5432/${POSTGRES_DB:-fer_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Memuat TensorFlow dan kedua model butuh waktu saat container baru menyala.
      start_period: 120s
    networks:
      - web
      - data

  database:
    image: ${IMAGE_PREFIX:-fer-ensemble}/database:${IMAGE_TAG:-local}
    build: ./database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-fer_db}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - data

# Database hanya berada di network "data", sehingga frontend tidak bisa mengaksesnya langsung.
networks:
  web:
  data:

volumes:
  db-data:
